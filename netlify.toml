
[[redirects]]
  from = "/sitemap.xml"
  to = "https://backend.docpats.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://backend.docpats.com/robots.txt"
  status = 200
  force = true

# Публичный контент переехал с /public/* в корень (/news, /articles, /about).
# Отдаём настоящий 301 — иначе бот получает SPA-шелл и клиентский редирект,
# а вес старого адреса на новый не переносится. Порядок важен: правила ниже
# должны стоять до catch-all на index.html. /public/doctor-profile/* и
# /public/doctor/* остаются на месте и сюда не попадают.
[[redirects]]
  from = "/public/news"
  to = "/news"
  status = 301
  force = true

[[redirects]]
  from = "/public/news/*"
  to = "/news/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/public/articles"
  to = "/articles"
  status = 301
  force = true

[[redirects]]
  from = "/public/articles/*"
  to = "/articles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/public/about"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  
[[edge_functions]]
  path = "/docs/*"
  function = "seo"

[[edge_functions]]
  path = "/articles/*"
  function = "seo"

[[edge_functions]]
  path = "/news/*"
  function = "seo"

[[edge_functions]]
  path = "/public/doctor-profile/article-detail-for-all/*"
  function = "seo"

[[edge_functions]]
  path = "/public/doctor/article-scientific-detail-for-all/*"
  function = "seo"

[[edge_functions]]
  path = "/public/doctor-profile/doctor-details/*"
  function = "seo"


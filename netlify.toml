
[[redirects]]
  from = "/sitemap.xml"
  to = "https://backend.docpats.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://backend.docpats.com/robots.txt"
  status = 200
  force = true

# Дочерние файлы sitemap-индекса. /sitemap.xml выше — сам индекс, одним
# файлом он весил 48 МБ при пределе Google в 50 МБ.
# Дублируется в public/_redirects, и это не лишнее: Netlify читает тот
# файл РАНЬШЕ, и без записи там сюда управление не дойдёт.
[[redirects]]
  from = "/sitemap-*"
  to = "https://backend.docpats.com/sitemap-:splat"
  status = 200
  force = true

# RSS и news-sitemap живут там же, где sitemap: их собирает бэкенд из базы
# новостного движка. Агрегаторы и Google News ищут эти файлы в корне
# домена, поэтому проксируем, а не отдаём с поддомена.
[[redirects]]
  from = "/rss.xml"
  to = "https://backend.docpats.com/rss.xml"
  status = 200
  force = true

[[redirects]]
  from = "/news-sitemap.xml"
  to = "https://backend.docpats.com/news-sitemap.xml"
  status = 200
  force = true

# Публичный контент переехал с /public/* в корень (/news, /articles, /about).
# Отдаём настоящий 301 — иначе бот получает SPA-шелл и клиентский редирект,
# а вес старого адреса на новый не переносится. Порядок важен: правила ниже
# должны стоять до catch-all на index.html. /public/doctor-profile/* и
# /public/doctor/* остаются на месте и сюда не попадают.
[[redirects]]
  from = "/public/news"
  to = "/news"
  status = 301
  force = true

[[redirects]]
  from = "/public/news/*"
  to = "/news/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/public/articles"
  to = "/articles"
  status = 301
  force = true

[[redirects]]
  from = "/public/articles/*"
  to = "/articles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/public/about"
  to = "/about"
  status = 301
  force = true

# Студия медицинских фильмов DP-Videra. Служба живёт на сервере новостей;
# сквозная передача, а не 301, — адрес в браузере остаётся нашим.
# Дублируется в public/_redirects, и это не лишнее: Netlify читает тот
# файл РАНЬШЕ, и без записи там сюда управление не дойдёт — та же
# причина, что у sitemap выше.
[[redirects]]
  from = "/dp-videra/*"
  to = "https://news-api.docpats.com/videra/:splat"
  status = 200
  force = true

# Без косой черты браузер сочтёт app.js соседом папки, а не файлом внутри.
[[redirects]]
  from = "/dp-videra"
  to = "/dp-videra/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  
# Edge-функция SEO объявляет свои адреса САМА — в netlify/edge-functions/seo.js,
# в `export const config`. Здесь её объявлений быть не должно: Netlify при
# совпадении поля отдаёт приоритет инлайновому объявлению, поэтому список
# путей из этого файла целиком перекрывался списком из seo.js. Так "/clinics/*"
# и выпал из обработки, оставаясь записанным здесь.

# ── Студия DP-Videra: свежесть важнее кэша ───────────────────────────
#
# ЗАЧЕМ ЭТО ЗДЕСЬ. Студия отдаёт свои файлы с «cache-control: no-cache» —
# проверено, сервер шлёт именно это. Но Netlify, проксируя запрос, ЗАМЕНЯЕТ
# заголовок на свой «max-age=14400»: четыре часа. Врач видел исправленную
# страницу только на следующий день, а до тех пор — старый app.js рядом с
# новым i18n.js, то есть голые ключи вместо подписей. Ровно на это и
# пожаловались: «не изменилось».
#
# Имена файлов у нас без отпечатка («app.js», а не «app.7f3c.js»), поэтому
# иначе как перепроверкой при каждом заходе свежести не добиться. Это
# дёшево: неизменившийся файл отвечает 304, без тела.
#
# ПОРЯДОК ВАЖЕН: правила ниже — частные, они идут первыми.

[[headers]]
  # Куски моделей и картинки структур — наоборот, кладутся навсегда.
  # Они неизменны по своей природе: изменился кусок — изменилось и имя.
  # Здесь счёт идёт на десятки мегабайт, и перекачивать их незачем.
  for = "/dp-videra/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/dp-videra/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/dp-videra/*"
  [headers.values]
    Cache-Control = "no-cache"

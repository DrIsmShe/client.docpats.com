<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo_docpats.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    </title>

    <meta
      name="description"

    <meta name="robots" content="index, follow" />

    <meta
      property="og:description"
      content="Professional medical platform for doctors, patients and clinics. AI-powered diagnostics and secure healthcare management."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docpats.com" />
    <meta property="og:image" content="https://docpats.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="DOCPATS – AI Digital Healthcare Platform"
    />
    <meta
      name="twitter:description"
      content="Secure AI-powered medical ecosystem for doctors, clinics and patients."
    />
    <meta name="twitter:image" content="https://docpats.com/og-image.jpg" />

    <!-- Favicons -->
    <link href="%PUBLIC_URL%/favicon.ico" rel="icon" />
    <link href="%PUBLIC_URL%/logo_docpats.png" rel="apple-touch-icon" />

    <!-- Google Fonts.
         display=swap: без него текст невидим, пока шрифт не скачался. -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700|Nunito:300,400,600,700|Poppins:300,400,500,600,700&display=swap"
      rel="stylesheet"
    />

    <!-- Vendor CSS Files.
         Удалены как неиспользуемые (проверено поиском по src/):
           • boxicons.min.css  — ни одного класса bx-*  (66 КБ)
           • quill.snow.css / quill.bubble.css — редактор в проекте CKEditor
           • simple-datatables/style.css
           • assets/css/bundle.css — Bootstrap 5.3.3 БЕЗ минификации плюс
             swiper и glightbox; Bootstrap уже подключён строкой выше, а
             swiper и glightbox в проекте не встречаются (391 КБ).
         Оставлены: bootstrap (сетка и компоненты), bootstrap-icons (bi-*,
         137 вхождений) и remixicon (ri-*, 200 вхождений). -->
    <link
      href="/assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="/assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="/assets/vendor/remixicon/remixicon.css" rel="stylesheet" />

    <!-- Template Main CSS Files -->
    <link href="/assets/css/style.css" rel="stylesheet" />
    <link href="/assets/css/index.css" rel="stylesheet" />
    <link href="/assets/css/app.css" rel="stylesheet" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DOCPATS MedConnect",
        "url": "https://docpats.com/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web",
        "description": "AI-powered healthcare SaaS platform connecting doctors, clinics and patients worldwide."
      }
    </script>
  </head>

  <body>
    <!-- Размер текста, выбранный читателем, восстанавливаем ДО первой
         отрисовки: если ждать монтирования React, страница успевает
         мигнуть обычным кеглем. Ключ и диапазон обязаны совпадать с
         src/components/FontSizeControl.jsx. -->
    <script>
      (function () {
        try {
          var s = parseFloat(localStorage.getItem("dp-font-scale"));
          if (s >= 0.9 && s <= 1.5 && s !== 1) {
            document.documentElement.style.zoom = String(s);
            document.documentElement.dataset.dpFontScale = String(s);
          }
        } catch (e) {
          /* хранилище недоступно — читаем обычным размером */
        }
      })();
    </script>

    <div id="root"></div>

    <script>
      // заглушка, чтобы app.js не падал
      window.TynApp = window.TynApp || {
        init: function () {},
        toggle: function () {},
      };
    </script>
    <!-- Vendor JS.
         Здесь лежало 3,4 МБ скриптов без defer — каждый блокировал разбор
         страницы. Удалено всё, чего нет в коде (проверено поиском по src/):

           echarts.min.js         1000 КБ — 0 вызовов (совпадения в поиске
                                            оказывались словом «recharts»)
           tinymce.min.js          417 КБ — 0 вызовов
           apexcharts.min.js       503 КБ — единственное упоминание лежит
                                            внутри JSX-комментария
           chart.umd.js            200 КБ — Chart.js берётся из npm через
                                            react-chartjs-2
           quill.min.js            211 КБ — редактор в проекте CKEditor
           simple-datatables.js     92 КБ — 0 вызовов
           validate.js               2 КБ — 0 вызовов
           assets/js/bundle.js     887 КБ — Bootstrap 5.3.3 без минификации
                                            плюс Swiper, GLightbox и jQuery;
                                            Bootstrap уже подключён ниже, а
                                            остальные три в проекте не
                                            встречаются. TynApp оттуда же —
                                            остаётся заглушка выше.

         Осталось три файла. defer, чтобы они не тормозили разбор HTML:
         bootstrap нужен из-за data-bs-* в разметке админки, main.js и
         app.js — мелкая обвязка темы. -->
    <script defer src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script defer src="/assets/js/main.js"></script>
    <script defer src="/assets/js/app.js"></script>

    <script>
      function scrollToBottom(el) {
        if (el) el.scrollTop = el.scrollHeight;
      }
      const content = document.getElementById("content");
      if (content) scrollToBottom(content);
    </script>
  </body>
</html>
